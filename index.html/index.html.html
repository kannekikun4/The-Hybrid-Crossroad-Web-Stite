<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Hybrid Crossroad | RELL SEAS Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&amp;family=Alegreya:ital,wght@0,400;0,600;1,400&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#14110a;--bg2:#1d1810;--ink:#f3ead2;--mute:#a89c7c;--gold:#f2c230;--amber:#c9751a;--line:#3a3220;--link:#f2c230;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6efdb;--bg2:#ece2c3;--ink:#2a2110;--mute:#6b5d38;--gold:#8a5a00;--amber:#a85d0a;--line:#cdbf93;--link:#7a4e00}}
:root[data-theme="light"]{--bg:#f6efdb;--bg2:#ece2c3;--ink:#2a2110;--mute:#6b5d38;--gold:#8a5a00;--amber:#a85d0a;--line:#cdbf93;--link:#7a4e00}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 Alegreya,Georgia,serif}
a{color:var(--link)}
h1,h2,h3{font-family:'Pirata One',Georgia,serif;font-weight:400;letter-spacing:.02em;margin:0}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
nav{display:flex;gap:18px;overflow-x:auto;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;white-space:nowrap}
nav a{text-decoration:none;color:var(--mute)}nav a:hover{color:var(--gold)}
.hero{text-align:center;padding:48px 20px 40px}
.logo{width:min(260px,64vw);height:auto;filter:drop-shadow(0 0 28px rgba(242,194,48,.45));animation:sway 5s ease-in-out 1 both}
@keyframes sway{0%{transform:rotate(-14deg)}60%{transform:rotate(5deg)}100%{transform:rotate(0)}}
h1{font-size:clamp(40px,10vw,68px);line-height:1.05;margin-top:18px;color:var(--gold)}
.sub{color:var(--mute);margin:10px auto 22px;max-width:34em}
.btn{display:inline-block;background:var(--gold);color:#14110a;text-decoration:none;padding:12px 26px;border-radius:4px;font:600 18px Alegreya,Georgia,serif;border:0;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.stats{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 28px;margin-top:20px;color:var(--mute);font-size:16px}
section{padding:44px 0;border-top:1px solid var(--line)}
h2{font-size:34px;color:var(--gold);margin-bottom:10px}
.lead{color:var(--mute);margin:0 0 14px}
.body h3{font-size:25px;margin:22px 0 4px}
.body p{margin:0 0 10px;max-width:42em}
.body ul{margin:0 0 6px;padding-left:20px;color:var(--mute);columns:2;column-gap:24px}
@media(max-width:520px){.body ul{columns:1}}
footer{padding:30px 0 60px;text-align:center;color:var(--mute);font-size:15px}
#editBtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;display:none}
#editor{display:none;position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
#editor.open{display:block}
#editor .box{max-width:760px;margin:0 auto}
#editor label{display:block;color:var(--mute);font-size:15px;margin:12px 0 4px}
#editor input,#editor textarea{width:100%;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:10px;font:16px/1.5 Alegreya,Georgia,serif}
#editor textarea{min-height:170px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.ed{border:1px solid var(--line);border-radius:6px;padding:12px;margin:14px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row .btn{padding:8px 14px;font-size:16px}
.hint{color:var(--mute);font-size:15px}
#msg{color:var(--amber);margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin-top:16px}
.card{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg2)}
.card img,.ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--bg)}
.ph{display:grid;place-items:center;color:var(--mute);font-size:15px}
.ci{padding:12px 14px}.ci h3{font-size:24px}.pr{color:var(--gold);font-weight:600}.sl{color:var(--mute);font-size:15px}.ci p{margin:6px 0 0;font-size:16px}
#q{width:100%;max-width:420px;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:10px;font:16px Alegreya,Georgia,serif}
.sm textarea{min-height:80px!important}.thumb{width:120px;aspect-ratio:4/3;object-fit:cover;border-radius:4px;display:block;margin-top:8px}
@media(prefers-reduced-motion:reduce){.logo{animation:none}html{scroll-behavior:auto}}
</style></head><body>

function el(t,p,...k){const e=document.createElement(t);Object.assign(e,p||{});k.forEach(x=>e.append(x));return e}
function field(label,val,on,area){const i=el(area?'textarea':'input',{value:val});i.oninput=()=>on(i.value);return el('div',null,el('label',{textContent:label}),i)}
function openEditor(){
 const e=$('#editor'),b=el('div',{className:'box'});e.innerHTML='';e.append(b);
 b.append(el('h2',{textContent:'Edit page'}),el('p',{className:'hint',textContent:'In section text: start a line with "## " for a subheading and "- " for a bullet. Other lines are paragraphs. Changes go live when you press Publish.'}));
 b.append(field('Site title',D.title,v=>D.title=v),field('Tagline',D.tagline,v=>D.tagline=v),field('Discord invite link',D.discord,v=>D.discord=v),
  field('Stats (one per line)',D.stats.join('\n'),v=>D.stats=v.split('\n').filter(Boolean),1),field('Footer',D.footer,v=>D.footer=v));
 D.sections.forEach((s,i)=>{
  const mv=(d)=>()=>{const j=i+d;if(j<0||j>=D.sections.length)return;[D.sections[i],D.sections[j]]=[D.sections[j],D.sections[i]];openEditor()};
  const box=el('div',{className:'ed'},field('Section title',s.title,v=>s.title=v),field('Section text',s.body,v=>s.body=v,1),
   el('div',{className:'row'},el('button',{className:'btn alt',type:'button',textContent:'Move up',onclick:mv(-1)}),el('button',{className:'btn alt',type:'button',textContent:'Move down',onclick:mv(1)}),
   el('button',{className:'btn alt',type:'button',textContent:'Delete section',onclick:function(){if(!this.dataset.a){this.dataset.a=1;this.textContent='Tap again to delete';return}D.sections.splice(i,1);openEditor()}})));
  b.append(box)});
 listEd(b);
 b.append(el('div',{className:'row'},el('button',{className:'btn alt',type:'button',textContent:'Add section',onclick:()=>{D.sections.push({title:'New section',body:'Write here.'});openEditor()}}),
  el('button',{className:'btn',type:'button',textContent:'Publish',onclick:save}),el('button',{className:'btn alt',type:'button',textContent:'Cancel',onclick:()=>location.reload()})),el('div',{id:'msg'}));
 e.className='open';e.scrollTop=0;
}
async function save(){
 const m=$('#msg');m.textContent='Publishing...';
 try{const a=await claude.use('artifact');if(!a){m.textContent='Publishing is not available in this view.';return}
  const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('#editor').innerHTML='';c.querySelector('#editor').className='';c.querySelector('#editBtn').removeAttribute('style');
  c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
  await a.publish('<!DOCTYPE html>'+c.outerHTML);
 }catch(x){m.textContent=x&&x.code==='conflict'?'The page was updated elsewhere. Reloading...':'Could not publish: '+((x&&(x.message||x.code))||'unknown error')}
}
function card(l){return '<article class="card">'+(l.img?'<img src="'+esc(l.img)+'" alt="'+esc(l.name)+'" loading="lazy">':'<div class="ph">No picture</div>')+'<div class="ci"><h3>'+esc(l.name)+'</h3><div class="pr">'+esc(l.price)+'</div>'+(l.category?'<div class="sl">'+esc(l.category)+'</div>':'')+(l.seller?'<div class="sl">Seller: '+esc(l.seller)+'</div>':'')+'<p>'+esc(l.desc)+'</p></div></article>'}
function listSec(){return '<section id="listings"><h2>Listings</h2><p class="lead">Items and services from the community. Contact the seller on Discord.</p><input id="q" type="search" placeholder="Search listings" aria-label="Search listings"><div class="grid" id="grid"></div></section>'}
function initGrid(){const g=$('#grid'),q=$('#q');const go=()=>{const t=q.value.toLowerCase(),r=(D.listings||[]).filter(l=>!t||[l.name,l.category,l.seller,l.desc].join(' ').toLowerCase().includes(t));g.innerHTML=r.length?r.map(card).join(''):'<p class="lead">'+((D.listings||[]).length?'No listings match your search.':'No listings yet. Post yours in #Marketplace on Discord.')+'</p>'};q.oninput=go;go()}
async function up(l,f,st){st.textContent='Uploading...';try{const a=await claude.use('assets');if(!a){st.textContent='Uploads are not available in this view.';return}const r=await a.upload(f);l.img='/_blob/'+r.id;openEditor(1)}catch(x){st.textContent='Upload failed: '+((x&&(x.message||x.code))||'unknown error')}}
function listEd(b){
 D.listings=D.listings||[];const keep=()=>{const e=$('#editor'),s=e.scrollTop;openEditor();e.scrollTop=s};
 b.append(el('h2',{textContent:'Listings',style:'margin-top:28px'}));
 D.listings.forEach((l,i)=>{const st=el('div',{className:'hint'}),fi=el('input',{type:'file',accept:'image/*'});fi.onchange=()=>fi.files[0]&&up(l,fi.files[0],st);
  const bx=el('div',{className:'ed sm'},field('Item name',l.name,v=>l.name=v),field('Price',l.price,v=>l.price=v),field('Seller',l.seller,v=>l.seller=v),field('Category',l.category,v=>l.category=v),field('Details',l.desc,v=>l.desc=v,1),
   el('label',{textContent:'Picture'}),fi,st);
  if(l.img){bx.append(el('img',{className:'thumb',src:l.img,alt:''}),el('div',{className:'row'},el('button',{className:'btn alt',type:'button',textContent:'Remove picture',onclick:()=>{l.img='';keep()}})))}
  bx.append(el('div',{className:'row'},el('button',{className:'btn alt',type:'button',textContent:'Delete listing',onclick:function(){if(!this.dataset.a){this.dataset.a=1;this.textContent='Tap again to delete';return}D.listings.splice(i,1);keep()}})));b.append(bx)});
 b.append(el('div',{className:'row'},el('button',{className:'btn alt',type:'button',textContent:'Add listing',onclick:()=>{D.listings.unshift({name:'New item',price:'',seller:'',category:'',desc:'',img:''});keep()}})));
}
render();
(async()=>{try{const u=await claude.use('user');if(u&&u.isOwner()){const b=$('#editBtn');b.style.display='block';b.onclick=openEditor}}catch(x){}})();
</script>
